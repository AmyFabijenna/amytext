<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beispiel: Sachtext analysieren | Deutschmatura</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            padding: 20px;
            margin: 0;
        }

        .welcome-section {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 40px;
            border-left: 5px solid #34495e;
        }

        .welcome-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            color: #2c3e50;
            border-bottom: 2px solid #34495e;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .text-example {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            border-left: 4px solid #34495e;
        }

        .text-example h4 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .accordion {
            margin: 30px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: white;
        }

        .accordion-header {
            background: linear-gradient(135deg, #34495e, #2c3e50);
            color: white;
            padding: 20px;
            margin: 0;
            cursor: pointer;
            font-size: 1.3em;
            transition: background 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .accordion-header:hover {
            background: linear-gradient(135deg, #2c3e50, #34495e);
        }

        .accordion-header h3 {
            margin: 0;
            color: white;
        }

        .accordion-icon {
            font-size: 1.5em;
            font-weight: bold;
            transition: transform 0.3s;
        }

        .accordion-header.active .accordion-icon {
            transform: rotate(45deg);
        }

        .panel {
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }

        .panel.active {
            max-height: 5000px;
            padding: 20px;
        }

        .exercise {
            background: #e8f4f8;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .exercise h4 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .solution-toggle {
            background: #5dade2;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
            font-size: 0.9em;
        }

        .solution-toggle:hover {
            background: #3498db;
        }

        .solution {
            background: #d4edda;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .tip-box {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .tip-box strong {
            color: #856404;
        }

        .card {
            background: #f8f9fa;
            padding: 20px;
            margin: 15px 0;
            border-left: 4px solid #3498db;
            border-radius: 5px;
        }

        .progress-section {
            background: #e8f4f8;
            border-radius: 10px;
            padding: 25px;
            margin: 30px 0;
            border-left: 4px solid #3498db;
        }

        .weiter-button {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            margin: 30px 0;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .weiter-button:hover {
            background: linear-gradient(135deg, #c0392b, #a93226);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(231, 76, 60, 0.3);
        }

        .method-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .method-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #3498db;
        }

        .method-card h4 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .highlight-box {
            background: #e8f6f3;
            border-left: 4px solid #1abc9c;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }

        .warning-box {
            background: #fdf2e9;
            border-left: 4px solid #e67e22;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="welcome-section">
        <h2>Sachtext-Analyse</h2>
        <p>Weiterführende Informationen gibt es hier auf Anfrage</p>
    </div>

    </body>
    </html>
