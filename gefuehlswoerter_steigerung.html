<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gefühlswörter – Steigerungsreihen</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c1a30;
  --bg2:#08111f;
  --panel:rgba(10,20,40,0.95);
  --surface:rgba(255,255,255,0.05);
  --y:#FFD700;
  --yglow:rgba(255,215,0,0.45);
  --text:#ddeaff;
  --muted:rgba(221,234,255,0.55);
  --dim:rgba(221,234,255,0.3);
  --r:12px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:1.5rem 1.25rem;line-height:1.6}
h1{font-size:1.45rem;font-weight:700;color:var(--y);margin-bottom:.2rem;letter-spacing:.02em}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:1.25rem}
.controls{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
#search{background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,215,0,.35);border-radius:10px;color:var(--text);padding:8px 14px;font-size:13.5px;outline:none;width:100%}
#search::placeholder{color:var(--dim)}
#search:focus{border-color:var(--y)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{background:transparent;border:1px solid rgba(255,215,0,.3);border-radius:14px;color:var(--muted);cursor:pointer;font-size:11.5px;padding:4px 11px;transition:all .15s}
.fbtn:hover{border-color:var(--y);color:var(--text)}
.fbtn.active{background:rgba(255,215,0,.14);border-color:var(--y);color:var(--y);font-weight:600}
.cnt{font-size:11.5px;color:var(--dim);margin-bottom:.85rem}
.btn-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.25rem}
.ebo{border:2px solid var(--y);border-radius:22px;cursor:pointer;font-size:13px;font-weight:600;padding:7px 17px;transition:all .18s;user-select:none;letter-spacing:.02em;white-space:nowrap}
.ebo:hover{box-shadow:0 0 10px var(--yglow);transform:translateY(-1px)}
.ebo.act{box-shadow:0 0 0 2px #fff,0 0 20px var(--yglow);transform:scale(1.06)}
.ebo.hid{display:none!important}
.frot   {background:#5A1515;color:#FFD5D5}
.flila  {background:#31115C;color:#DDD0F8}
.fblau  {background:#152460;color:#BDD4FF}
.fgold  {background:#483A00;color:#FFF0A0}
.fpink  {background:#4D1530;color:#FFD0E6}
.fgruen {background:#0A3A1E;color:#B5F0CC}
.forang {background:#4A1E00;color:#FFD8A0}
.fnavy  {background:#0A1C50;color:#B8CCFF}
.fviol  {background:#2C0F50;color:#E2CCFF}
.fgrau  {background:#1E2C3A;color:#C5D8E8}
#detail{display:none;background:var(--panel);border:1.5px solid rgba(255,215,0,.4);border-radius:14px;padding:1.2rem 1.4rem;animation:fadeIn .2s ease}
#detail.open{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:.9rem;flex-wrap:wrap}
.dname{font-size:1.25rem;font-weight:700;color:var(--y)}
.dbadge{font-size:10.5px;padding:3px 10px;border-radius:12px;font-weight:600;letter-spacing:.05em}
.slbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,215,0,.7);margin:.7rem 0 .45rem}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.stp{font-size:12px;padding:3px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);transition:opacity .1s}
.arr{font-size:11px;color:rgba(255,215,0,.45)}
.div{border:none;border-top:1px solid rgba(255,255,255,.07);margin:.7rem 0}
.kbody{display:flex;flex-direction:column;gap:5px}
.krow{display:flex;gap:9px;align-items:flex-start}
.kn{font-size:10px;color:var(--y);font-weight:700;min-width:15px;padding-top:3px;opacity:.75}
.kt{font-size:12.5px;color:rgba(221,234,255,.82);line-height:1.6}
.cbtn{margin-top:.9rem;background:transparent;border:1px solid rgba(255,215,0,.3);border-radius:8px;color:var(--muted);cursor:pointer;font-size:11.5px;padding:5px 14px;transition:all .15s}
.cbtn:hover{border-color:var(--y);color:var(--y)}
</style>
</head>
<body>
<h1>Gefühlswörter · Steigerungsreihen</h1>
<p class="sub">Für Erlebniserzählungen · Wörter &amp; körperliche Empfindungen · aufsteigend</p>
<div class="controls">
  <input type="text" id="search" placeholder="Gefühl suchen …" oninput="applyFilters()">
  <div class="filters">
    <button class="fbtn active" onclick="setTag('alle',this)">Alle</button>
    <button class="fbtn" onclick="setTag('negativ',this)">Negativ</button>
    <button class="fbtn" onclick="setTag('positiv',this)">Positiv</button>
    <button class="fbtn" onclick="setTag('sozial',this)">Sozial</button>
    <button class="fbtn" onclick="setTag('körper',this)">Körper</button>
    <button class="fbtn" onclick="setTag('aktivierung',this)">Aktivierung</button>
    <button class="fbtn" onclick="setTag('selbst',this)">Selbst &amp; Scham</button>
    <button class="fbtn" onclick="setTag('trauer',this)">Trauer</button>
  </div>
</div>
<p class="cnt" id="cnt"></p>
<div class="btn-grid" id="btngrid"></div>
<div id="detail"></div>

<script>
const D=[
{n:"Wut",t:["negativ","körper"],f:"frot",fam:"Stark-Negativ",
 s:["verärgert","genervt","ärgerlich","wütend","aufgebracht","rasend","außer sich","ausrasten"],
 k:["Ich runzelte die Stirn.","Ich biss die Zähne zusammen.","Ich ballte unwillkürlich die Fäuste.","Das Blut schoss mir ins Gesicht.","Ich zitterte am ganzen Leib.","Mir tropfte der Schweiß von der Stirn.","Ich schlug mit der Faust auf den Tisch.","Ein Schrei riss sich aus meiner Kehle, bevor ich es verhindern konnte."]},
{n:"Frustration",t:["negativ","körper"],f:"frot",fam:"Stark-Negativ",
 s:["leicht genervt","frustriert","zunehmend frustriert","tief frustriert","am Ende der Geduld","am liebsten hinschmeißen"],
 k:["Ich seufzte laut.","Ich rieb mir die Schläfen.","Meine Kiefermuskulatur spannte sich an.","Ich schloss kurz die Augen.","Meine Hände ballten sich zu Fäusten.","Ich hätte am liebsten alles weggeworfen — und tat es beinahe."]},
{n:"Empörung",t:["negativ","körper"],f:"frot",fam:"Stark-Negativ",
 s:["leicht entrüstet","empört","entrüstet","erzürnt","aufgebracht","kochend vor Empörung"],
 k:["Ich holte tief Luft.","Mein Gesicht lief heiß an.","Ich richtete mich auf.","Meine Stimme wurde lauter und fester.","Ich schlug mit der flachen Hand auf die Fläche.","Ich zitterte — nicht vor Angst, sondern vor gerechtem Zorn."]},
{n:"Bitterkeit",t:["negativ"],f:"frot",fam:"Stark-Negativ",
 s:["ein Hauch Bitterkeit","verbittert","bitter","tief verbittert","von Bitterkeit vergiftet","in Bitterkeit erstarrt"],
 k:["Ich schmeckte etwas Saures im Mund.","Mein Gesicht verhärtete sich.","Meine Lippen pressten sich zusammen.","Ich wandte den Blick ab.","Meine Haltung schloss sich, als wollte ich niemanden mehr hereinlassen.","Jede Erinnerung schmerzte — und ich ließ sie dennoch nicht los."]},
{n:"Ekel",t:["negativ","körper"],f:"frot",fam:"Stark-Negativ",
 s:["ein wenig angewidert","unangenehm berührt","angeekelt","angewidert","tief abgestoßen","mir wurde schlecht"],
 k:["Meine Nase rümpfte sich.","Mein Magen hob sich.","Ich trat unwillkürlich zurück.","Ich hielt mir die Hand vor den Mund.","Übelkeit stieg in mir auf.","Ich musste mich abwenden.","Mir drehte sich alles — ich musste würgen."]},
{n:"Neid",t:["negativ"],f:"frot",fam:"Stark-Negativ",
 s:["ein wenig neidisch","neidisch","missgünstig","grün vor Neid","von Neid zerfressen","bitter neidisch"],
 k:["Ich verkrampfte mich innerlich.","Meine Stimmung verdüsterte sich.","Ich konnte kaum hinschauen.","Ein bitterer Geschmack breitete sich in meinem Mund aus.","Mein Magen zog sich zusammen.","Die Freude an dem, was ich hatte, verblasste."]},
{n:"Schmerz",t:["negativ","körper"],f:"frot",fam:"Stark-Negativ",
 s:["Unbehagen","leichtes Ziehen","dumpfer Schmerz","stechender Schmerz","bohrend","brennend","unerträglich"],
 k:["Ich zuckte kurz zusammen.","Ich biss die Zähne zusammen.","Ein Zischen entwich meinen Lippen.","Ich krümmte mich.","Ich stöhnte — und schämte mich nicht dafür.","Tränen pressten sich aus meinen Augen, obwohl ich es nicht wollte.","Alles drehte sich vor Schmerz.","Die Welt verschwamm vor mir zu einem weißen Rauschen."]},
{n:"Angst",t:["negativ","körper"],f:"flila",fam:"Anspannung",
 s:["unwohl","mulmig","besorgt","ängstlich","verängstigt","panisch","starr vor Angst"],
 k:["Gänsehaut überlief mich.","Mein Herz setzte einen Schlag aus.","Mein Magen zog sich zusammen.","Meine Hände wurden eiskalt und schweißnass.","Meine Knie zitterten.","Der Atem stockte mir in der Kehle.","Kalter Schweiß brach mir aus.","Ich stand wie angewurzelt da — mein Körper verweigerte jeden Befehl."]},
{n:"Nervosität",t:["negativ","körper"],f:"flila",fam:"Anspannung",
 s:["unruhig","nervös","angespannt","fahrig","zittrig","kribbelig","gereizt","am Ende der Nerven"],
 k:["Ich trommelte mit den Fingern auf den Tisch.","Meine Hände wurden feucht.","Ein leises Kribbeln breitete sich in meinem Bauch aus.","Mein Herz pochte schneller als gewöhnlich.","Meine Stimme zitterte, als ich sprach.","Meine Knie wurden weich, als ich aufstand.","Ich konnte nicht mehr stillsitzen — mein ganzer Körper war in Aufruhr.","Mir war so übel, dass ich kaum noch atmen konnte."]},
{n:"Eifersucht",t:["negativ"],f:"flila",fam:"Anspannung",
 s:["ein bisschen eifersüchtig","eifersüchtig","argwöhnisch","von Eifersucht geplagt","blind eifersüchtig","rasend vor Eifersucht"],
 k:["Ich beobachtete alles ganz genau.","Mein Atem wurde flacher.","Mir wurde warm und heiß gleichzeitig.","Mein Herz zog sich zusammen.","Meine Hände wurden kalt.","Ich konnte nicht mehr klar denken."]},
{n:"Misstrauen",t:["negativ"],f:"flila",fam:"Anspannung",
 s:["ein schlechtes Gefühl","skeptisch","misstrauisch","argwöhnisch","auf der Hut","vollkommen misstrauisch"],
 k:["Ich beobachtete genauer als sonst.","Mein Nacken spannte sich an.","Mein Blick wurde schmal.","Ich rückte von der Person ab.","Meine Schultern zogen sich hoch.","Ich hörte auf jeden Ton — und misstraute selbst der Stille."]},
{n:"Hilflosigkeit",t:["negativ","körper"],f:"flila",fam:"Anspannung",
 s:["hilflos zuschauen","machtlos","ohnmächtig","vollständig hilflos","gefangen in Hilflosigkeit","kraftlos erstarrt"],
 k:["Meine Arme hingen herab.","Ich presste die Hände zusammen — ohne zu wissen warum.","Mein Blick suchte, fand aber nichts.","Mein Herz zog sich zusammen.","Tränen kamen — nicht aus Trauer, sondern aus purer Ohnmacht.","Ich war da und zugleich nirgendwo."]},
{n:"Verwirrung",t:["negativ","körper"],f:"flila",fam:"Anspannung",
 s:["ein wenig unklar","verwirrt","desorientiert","völlig durcheinander","verloren","ratlos wie noch nie"],
 k:["Ich runzelte die Stirn.","Ich schüttelte den Kopf.","Ich schaute mich um, als könnte die Antwort irgendwo stehen.","Mein Blick wurde leer.","Ich atmete flach und schnell.","Mir schwindelte — der Boden schien nicht mehr fest zu sein."]},
{n:"Traurigkeit",t:["negativ","trauer","körper"],f:"fblau",fam:"Trauer",
 s:["betrübt","traurig","niedergeschlagen","untröstlich","am Boden zerstört","in tiefe Trauer versunken"],
 k:["Meine Augen wurden schwer.","Ich senkte den Kopf.","Meine Schultern fielen nach vorne.","Ein Druck legte sich auf meine Brust.","Ich konnte nicht mehr schlucken.","Tränen liefen still über meine Wangen.","Ich zog mich in mich selbst zurück wie eine Muschel, die sich schließt."]},
{n:"Einsamkeit",t:["negativ","trauer"],f:"fblau",fam:"Trauer",
 s:["allein","einsam","verlassen","ausgegrenzt","isoliert","vollkommen allein auf der Welt"],
 k:["Stille drückte sich schwer gegen meine Ohren.","Ich starrte ins Leere.","Mein Magen zog sich zusammen.","Ich umfasste meine eigenen Arme.","Die Kälte kroch von innen.","Ich saß da und wartete auf ein Geräusch, das nicht kam."]},
{n:"Verzweiflung",t:["negativ","trauer","körper"],f:"fblau",fam:"Trauer",
 s:["beunruhigt","besorgt","hilflos","verzweifelt","am Ende","in den Abgrund blickend"],
 k:["Mir zitterten die Hände.","Ich konnte nicht mehr klar denken.","Ich presste die Hände vors Gesicht.","Mein Herz raste und war gleichzeitig schwer wie Stein.","Die Tränen kamen lautlos.","Ich sank zusammen, als hätten alle Kräfte mich verlassen."]},
{n:"Enttäuschung",t:["negativ","trauer"],f:"fblau",fam:"Trauer",
 s:["etwas enttäuscht","enttäuscht","bitter enttäuscht","tief enttäuscht","desillusioniert","innerlich gebrochen"],
 k:["Ich ließ die Schultern hängen.","Ich schluckte.","Mein Atem stockte kurz.","Mir sank das Herz.","Ich wandte mich ab.","Ich merkte, wie die Vorfreude aus mir wich wie Luft aus einem Ballon."]},
{n:"Melancholie",t:["negativ","trauer"],f:"fblau",fam:"Trauer",
 s:["ein wenig trübsinnig","nachdenklich","schwermütig","melancholisch","in stiller Trauer versunken","von tiefem Weltschmerz erfasst"],
 k:["Ich starrte ins Leere.","Alles verlangsamte sich.","Ein leises Gewicht legte sich auf meine Brust.","Die Farben um mich herum schienen blasser.","Ich atmete langsam und schwer.","Die Stille war warm und kalt zugleich."]},
{n:"Freude",t:["positiv","körper"],f:"fgold",fam:"Wohlbefinden",
 s:["froh","erfreut","begeistert","fröhlich","strahlend","überschwänglich","jauchzend"],
 k:["Meine Augen leuchteten auf.","Ich lächelte unwillkürlich.","Mein Herz machte einen kleinen Hüpfer.","Ich klatschte in die Hände.","Meine Füße wollten springen.","Ich umarmte jeden, der in meiner Nähe war.","Es prickelte in meinen Fingerspitzen — wie lauter kleine Funken."]},
{n:"Glücklichkeit",t:["positiv"],f:"fgold",fam:"Wohlbefinden",
 s:["zufrieden","froh","heiter","glücklich","überglücklich","selig","im siebten Himmel schweben"],
 k:["Meine Mundwinkel zogen sich unwillkürlich in die Höhe.","Ein Lächeln breitete sich auf meinem Gesicht aus, bevor ich es bemerkte.","Mein Herz wurde weit.","Eine Wärme breitete sich in meiner Brust aus.","Ich fühlte mich leicht wie eine Feder.","Ich strahlte über das ganze Gesicht, sodass mir die Wangen wehtaten.","Ich hätte tanzen können — und Teile von mir taten es, ganz ohne Musik."]},
{n:"Fröhlichkeit",t:["positiv"],f:"fgold",fam:"Wohlbefinden",
 s:["aufgeheitert","heiter","ausgelassen","übermütig","quirlig","sprühend vor Lebendigkeit"],
 k:["Mein Gang wurde leichter.","Meine Augen blitzten.","Lachen sprudelte aus mir heraus.","Ich begann leise vor mich hin zu summen.","Meine Füße wollten tanzen.","Ich konnte nicht stillsitzen — und hörte gar nicht mehr damit auf."]},
{n:"Spaß",t:["positiv"],f:"fgold",fam:"Wohlbefinden",
 s:["amüsiert","belustigt","zum Lachen gereizt","kichernd","prustend","sich ausschütten vor Lachen"],
 k:["Ein Schmunzeln huschte über mein Gesicht.","Ich kicherte leise.","Ich lachte laut auf.","Ich prustete los — und konnte nicht mehr aufhören.","Tränen liefen mir über die Wangen.","Ich hielt mir den Bauch.","Ich konnte kaum noch Luft bekommen vor lauter Lachen."]},
{n:"Euphorie",t:["positiv","körper"],f:"fgold",fam:"Wohlbefinden",
 s:["sehr gut drauf","begeistert","hochgestimmt","euphorisch","ekstatisch","in reiner Hochstimmung schwebend"],
 k:["Ich musste lachen, ohne Grund.","Mein Körper kribbelte überall.","Ich konnte kaum stillstehen.","Mir wurde leicht — unglaublich leicht.","Ich hätte fliegen können.","Alles war strahlend klar und wunderschön — jede Kleinigkeit."]},
{n:"Dankbarkeit",t:["positiv","sozial"],f:"fgold",fam:"Wohlbefinden",
 s:["erkenntlich sein","dankbar sein","tief dankbar","zu Tränen gerührt","überwältigt von Dankbarkeit","sprachlos vor Dankbarkeit"],
 k:["Eine Wärme breitete sich in meiner Brust aus.","Meine Kehle wurde eng.","Meine Augen wurden feucht.","Ich legte unwillkürlich die Hand auf mein Herz.","Mich ergriff ein tiefer Schauer.","Worte versagten mir — und ich ließ meine Umarmung sprechen."]},
{n:"Freundschaft",t:["positiv","sozial"],f:"fpink",fam:"Verbundenheit",
 s:["Sympathie","Zuneigung","Verbundenheit","tiefe Freundschaft","unzertrennlich","Seelenverwandtschaft"],
 k:["Eine angenehme Wärme breitete sich in mir aus.","Ein Lächeln kam ganz von selbst, sobald ich die Person sah.","Ich rückte näher.","Ich legte die Hand auf ihre Schulter.","Wir saßen Schulter an Schulter, ohne ein Wort zu brauchen.","Ich fühlte mich so wohl wie nirgendwo sonst auf der Welt."]},
{n:"Gemeinschaft",t:["positiv","sozial"],f:"fpink",fam:"Verbundenheit",
 s:["zusammen sein","Zusammengehörigkeit spüren","Verbundenheit","Teil von etwas Größerem","eins mit der Gruppe","ein Herz und eine Seele"],
 k:["Eine Wärme strömte durch mich.","Ich spürte die Schultern der anderen neben mir.","Gemeinsames Lachen hallte durch den Raum.","Ich fühlte mich getragen.","Wir fielen uns in die Arme.","Mein Herz war zum Zerreißen voll — und es war das Schönste, das ich je gespürt hatte."]},
{n:"Liebe",t:["positiv","sozial"],f:"fpink",fam:"Verbundenheit",
 s:["Zuneigung","Zärtlichkeit","tiefe Zuneigung","tiefe Liebe","bedingungslose Liebe","alles-umfassende Liebe"],
 k:["Ich lächelte ohne besonderen Grund.","Mein Herz wurde weit.","Ich wollte die andere Person schützend in die Arme nehmen.","Eine tiefe Ruhe breitete sich in mir aus.","Ich spürte, wie alles andere verblasste.","Mein ganzer Körper strahlte Wärme aus."]},
{n:"Verliebtheit",t:["positiv","sozial","körper"],f:"fpink",fam:"Verbundenheit",
 s:["aufmerksam","interessiert","angezogen","verliebt","hoffnungslos verliebt","bis über beide Ohren verliebt"],
 k:["Ich wurde nervös in seiner Nähe.","Mein Herz pochte schneller, kaum dass ich die Person sah.","Mir wurde warm.","Ich konnte nicht aufhören zu lächeln.","Ich vergaß, was ich eigentlich sagen wollte.","Schmetterlinge im Bauch — nur dass es mehr wie ein Sturm war."]},
{n:"Mitgefühl",t:["positiv","sozial"],f:"fpink",fam:"Verbundenheit",
 s:["Aufmerksamkeit","Anteilnahme","Mitgefühl","tiefes Mitgefühl","Erbarmen","überwältigendes Mitgefühl"],
 k:["Ich hörte auf zu reden und hörte einfach zu.","Mein Herz zog sich zusammen.","Ich rückte näher.","Mir wurden die Augen feucht.","Ich wollte die andere Person einfach in die Arme nehmen.","Ihr Schmerz wurde auf einmal meiner."]},
{n:"Zärtlichkeit",t:["positiv","sozial"],f:"fpink",fam:"Verbundenheit",
 s:["sanft gestimmt","zärtlich","liebevoll","überwältigend zärtlich","von Zärtlichkeit durchströmt","zärtlich bis ins Mark"],
 k:["Meine Berührungen wurden leiser.","Ich sprach sanfter.","Ich lächelte unwillkürlich.","Meine Hände legten sich behutsam.","Ich atmete langsamer.","Ich wollte den Moment einfrieren — alles war weich und warm."]},
{n:"Erleichterung",t:["positiv","körper"],f:"fgruen",fam:"Entspannung",
 s:["etwas ruhiger werden","aufatmen","entspannen","eine Last fällt ab","befreit sein","wie neugeboren"],
 k:["Ich atmete tief und zitternd aus.","Meine Schultern sanken herab.","Meine Knie wurden weich, beinahe hätte ich mich hingesetzt.","Tränen stiegen in meine Augen — Tränen der Erleichterung.","Ich ließ mich in den nächsten Sessel fallen.","Mein ganzer Körper erschlaffte, als hätten sich alle Fäden gelöst."]},
{n:"Zufriedenheit",t:["positiv"],f:"fgruen",fam:"Entspannung",
 s:["in Ordnung","zufrieden","wohl","behaglich","tief zufrieden","in sich ruhend"],
 k:["Ich lehnte mich entspannt zurück.","Mein Atem floss ruhig.","Ich seufzte wohlig.","Eine tiefe Stille breitete sich in mir aus.","Meine Schultern sanken entspannt herab.","Ich spürte, wie mein ganzer Körper losließ."]},
{n:"Gelassenheit",t:["positiv"],f:"fgruen",fam:"Entspannung",
 s:["etwas ruhiger","ruhig","gelassen","ausgeglichen","tief in sich ruhend","vollkommen gleichmütig"],
 k:["Mein Atem floss gleichmäßig.","Meine Schultern sanken ab.","Meine Hände lagen offen im Schoß.","Mein Herzschlag wurde langsam und ruhig.","Ich spürte den Boden unter mir.","Ich war einfach — und das war genug."]},
{n:"Geborgenheit",t:["positiv"],f:"fgruen",fam:"Entspannung",
 s:["etwas sicherer","geborgen","beschützt","tief geborgen","vollkommen sicher","wie zu Hause in sich selbst"],
 k:["Ich atmete tief und vollständig.","Meine Muskeln ließen los.","Eine Wärme hüllte mich ein.","Ich schloss die Augen und ließ alles sein.","Mein Körper entspannte sich bis in die Zehenspitzen.","Ich wollte nirgendwo anders sein."]},
{n:"Hoffnung",t:["positiv"],f:"fgruen",fam:"Entspannung",
 s:["ein kleines Fünkchen Hoffnung","hoffen","zuversichtlich sein","voller Hoffnung","mit Zuversicht erfüllt","von Hoffnung getragen"],
 k:["Ich richtete mich auf.","Mein Blick hob sich.","Ich atmete tiefer.","Mein Herz wurde leichter.","Ein Lächeln brach sich Bahn.","Ich spürte, wie Energie langsam zurückkehrte."]},
{n:"Demut",t:["positiv"],f:"fgruen",fam:"Entspannung",
 s:["nachdenklich","bescheiden","demütig","tief ergriffen","in stiller Dankbarkeit","von echter Demut erfüllt"],

let activeTag="alle", activeIdx=-1;

function setTag(t,btn){
  activeTag=t;
  document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  applyFilters();
}

function applyFilters(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const btns=document.querySelectorAll(".ebo");
  let vis=0;
  btns.forEach((b,i)=>{
    const d=D[i];
    const mQ=!q||d.n.toLowerCase().includes(q)||d.s.join(" ").toLowerCase().includes(q)||d.k.join(" ").toLowerCase().includes(q);
    const mT=activeTag==="alle"||d.t.includes(activeTag);
    if(mQ&&mT){b.classList.remove("hid");vis++}else{b.classList.add("hid")}
  });
  document.getElementById("cnt").textContent=vis+" von "+D.length+" Gefühlen";
}

function showDetail(i){
  const d=D[i];
  const prev=activeIdx;
  document.querySelectorAll(".ebo").forEach((b,j)=>b.classList.toggle("act",j===i));
  if(prev===i){closeDetail();return;}
  activeIdx=i;
  const steps=d.s.map((s,j)=>{
    const cls="s"+Math.min(j,7);
    return `<span class="stp ${cls}">${s}</span>${j<d.s.length-1?'<span class="arr">›</span>':""}`
  }).join("");
  const krows=d.k.map((k,j)=>`<div class="krow"><span class="kn">${j+1}</span><span class="kt">${k}</span></div>`).join("");
  const det=document.getElementById("detail");
  det.innerHTML=`
<div class="dhead">
  <span class="dname">${d.n}</span>
  <span class="dbadge ${d.f}">${d.fam}</span>
</div>
<p class="slbl">Steigerung der Begriffe</p>
<div class="steps">${steps}</div>
<hr class="div">
<p class="slbl">Körperliche Empfindungen (aufsteigend)</p>
<div class="kbody">${krows}</div>
<button class="cbtn" onclick="closeDetail()">✕ schließen</button>`;
  det.classList.add("open");
  setTimeout(()=>det.scrollIntoView({behavior:"smooth",block:"nearest"}),50);
}

function closeDetail(){
  activeIdx=-1;
  document.querySelectorAll(".ebo").forEach(b=>b.classList.remove("act"));
  const det=document.getElementById("detail");
  det.classList.remove("open");
}

function build(){
  const g=document.getElementById("btngrid");
  D.forEach((d,i)=>{
    const b=document.createElement("button");
    b.className=`ebo ${d.f}`;
    b.dataset.idx=i;
    b.textContent=d.n;
    b.onclick=()=>showDetail(i);
    g.appendChild(b);
  });
  applyFilters();
}
build();
</script>
