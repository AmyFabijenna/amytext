
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);color:var(--color-text-primary)}
.wrap{padding:1rem 0}
.top{display:flex;gap:10px;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap}
.top input{flex:1;min-width:160px;padding:8px 12px;font-size:14px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font-size:12px;padding:4px 10px;border:0.5px solid var(--color-border-secondary);border-radius:20px;background:transparent;color:var(--color-text-secondary);cursor:pointer;transition:all .15s}
.fbtn.active,.fbtn:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);background:var(--color-background-primary);overflow:hidden;transition:box-shadow .15s}
.card:hover{border-color:var(--color-border-secondary)}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.emo-name{font-size:15px;font-weight:500;flex:1}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.toggle{font-size:18px;color:var(--color-text-tertiary);transition:transform .2s;line-height:1}
.card-body{display:none;padding:0 16px 16px}
.card-body.open{display:block}
.section-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-tertiary);margin:12px 0 6px}
.steps{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.step{font-size:13px;padding:3px 9px;border-radius:20px;border:0.5px solid var(--color-border-tertiary)}
.arrow{font-size:12px;color:var(--color-text-tertiary)}
.koerper{display:flex;flex-direction:column;gap:5px}
.krow{display:flex;gap:8px;align-items:flex-start}
.knum{font-size:10px;font-weight:500;color:var(--color-text-tertiary);min-width:14px;padding-top:2px}
.ktext{font-size:13px;color:var(--color-text-secondary);line-height:1.5}
.divider{border:none;border-top:0.5px solid var(--color-border-tertiary);margin:10px 0}
.count{font-size:13px;color:var(--color-text-tertiary);margin-bottom:.75rem}
.hidden{display:none!important}

.r{color:#A32D2D;background:#FCEBEB;border-color:#F7C1C1}
.rdt{color:#A32D2D}
.c{color:#993C1D;background:#FAECE7;border-color:#F5C4B3}
.cdt{color:#993C1D}
.p{color:#534AB7;background:#EEEDFE;border-color:#CECBF6}
.pdt{color:#534AB7}
.a{color:#854F0B;background:#FAEEDA;border-color:#FAC775}
.adt{color:#854F0B}
.t{color:#0F6E56;background:#E1F5EE;border-color:#9FE1CB}
.tdt{color:#0F6E56}
.b{color:#185FA5;background:#E6F1FB;border-color:#B5D4F4}
.bdt{color:#185FA5}
.pk{color:#993556;background:#FBEAF0;border-color:#F4C0D1}
.pkdt{color:#993556}
.g{color:#5F5E5A;background:#F1EFE8;border-color:#D3D1C7}
.gdt{color:#5F5E5A}
</style>

<div class="wrap">
<h2 class="sr-only">Gefühlswörter-Steigerungsreihen für Erlebniserzählungen</h2>
<div class="top">
  <input type="text" id="search" placeholder="Gefühl suchen …" oninput="filter()">
  <div class="filters">
    <button class="fbtn active" onclick="setTag('alle',this)">Alle</button>
    <button class="fbtn" onclick="setTag('negativ',this)">Negativ</button>
    <button class="fbtn" onclick="setTag('positiv',this)">Positiv</button>
    <button class="fbtn" onclick="setTag('körper',this)">Körper</button>
    <button class="fbtn" onclick="setTag('sozial',this)">Sozial</button>
  </div>
</div>
<p class="count" id="cnt"></p>
<div class="grid" id="grid"></div>
</div>

<script>
const data=[
{name:"Wut",tags:["negativ","körper"],col:"r",badge:"rdt",fam:"Stark-Negativ",
 schritte:["verärgert","genervt","ärgerlich","wütend","aufgebracht","rasend","außer sich","ausrasten"],
 koerper:["Ich runzelte die Stirn.","Ich biss die Zähne zusammen.","Ich ballte unwillkürlich die Fäuste.","Das Blut schoss mir ins Gesicht.","Ich zitterte am ganzen Leib.","Mir tropfte der Schweiß von der Stirn.","Ich schlug mit der Faust auf den Tisch.","Ein Schrei riss sich aus meiner Kehle, bevor ich es verhindern konnte."]},
{name:"Nervosität",tags:["negativ","körper"],col:"p",badge:"pdt",fam:"Anspannung",

 koerper:["Ich trommelte mit den Fingern auf den Tisch.","Meine Hände wurden feucht.","Ein leises Kribbeln breitete sich in meinem Bauch aus.","Mein Herz pochte schneller als gewöhnlich.","Meine Stimme zitterte, als ich sprach.","Meine Knie wurden weich, als ich aufstand.","Ich konnte nicht mehr stillsitzen — mein ganzer Körper war in Aufruhr.","Mir war so übel, dass ich kaum noch atmen konnte."]},
{name:"Aufregung",tags:["positiv","körper"],col:"a",badge:"adt",fam:"Aktivierung",
 schritte:["gespannt","aufgeregt","erregt","fieberhaft erregt","elektrisiert","mitgerissen","überwältigt vor Aufregung"],
 koerper:["Ein leises Kribbeln lief mir den Rücken hinunter.","Mein Herz schlug schneller.","Ich konnte kaum stillsitzen.","Adrenalin schoss durch meinen Körper.","Meine Hände zitterten vor lauter Erregung.","Ich bebte am ganzen Körper.","Ich hätte schreien können vor Aufregung — und tat es fast."]},
{name:"Erleichterung",tags:["positiv","körper"],col:"t",badge:"tdt",fam:"Entspannung",
 schritte:["etwas ruhiger werden","aufatmen","entspannen","eine Last fällt ab","befreit sein","wie neugeboren"],
 koerper:["Ich atmete tief und zitternd aus.","Meine Schultern sanken herab.","Meine Knie wurden weich, beinahe hätte ich mich hingesetzt.","Tränen stiegen in meine Augen — Tränen der Erleichterung.","Ich ließ mich in den nächsten Sessel fallen.","Mein ganzer Körper erschlaffte, als hätten sich alle Fäden gelöst."]},
{name:"Glücklichkeit",tags:["positiv"],col:"t",badge:"tdt",fam:"Wohlbefinden",

 koerper:["Meine Mundwinkel zogen sich unwillkürlich in die Höhe.","Ein Lächeln breitete sich auf meinem Gesicht aus, bevor ich es bemerkte.","Mein Herz wurde weit.","Eine Wärme breitete sich in meiner Brust aus.","Ich fühlte mich leicht wie eine Feder.","Ich strahlte über das ganze Gesicht, sodass mir die Wangen wehtaten.","Ich hätte tanzen können — und Teile von mir taten es, ganz ohne Musik."]},
{name:"Angst",tags:["negativ","körper"],col:"p",badge:"pdt",fam:"Anspannung",
 schritte:["unwohl","mulmig","besorgt","ängstlich","verängstigt","panisch","starr vor Angst"],
 koerper:["Gänsehaut überlief mich.","Mein Herz setzte einen Schlag aus.","Mein Magen zog sich zusammen.","Meine Hände wurden eiskalt und schweißnass.","Meine Knie zitterten.","Der Atem stockte mir in der Kehle.","Kalter Schweiß brach mir aus.","Ich stand wie angewurzelt da — mein Körper verweigerte jeden Befehl."]},
{name:"Stolz",tags:["positiv","körper"],col:"b",badge:"bdt",fam:"Selbstwert",
 schritte:["zufrieden","stolz","sehr stolz","erfüllt von Stolz","mächtig stolz","überströmend vor Stolz"],
 koerper:["Ich richtete mich auf.","Ich reckte unwillkürlich die Brust vor.","Mein Kopf hob sich wie von selbst.","Meine Schultern zogen sich zurück.","Mein Herz schwoll.","Ich strahlte, sodass ich kaum in mich hineinpassen konnte — als würde die Freude durch alle Poren dringen."]},
{name:"Selbstsicherheit",tags:["positiv","körper"],col:"b",badge:"bdt",fam:"Selbstwert",

 koerper:["Mein Atem wurde ruhiger und tiefer.","Ich hielt den Blickkontakt, ohne wegzusehen.","Ich saß aufrechter als sonst.","Meine Stimme klang fest und klar.","Mein Händedruck war ruhig und fest.","Ruhe strömte durch mich hindurch wie warmes Wasser — ich spürte nicht einmal mehr das Zittern."]},
{name:"Schmerz",tags:["negativ","körper"],col:"r",badge:"rdt",fam:"Stark-Negativ",
 schritte:["Unbehagen","leichtes Ziehen","dumpfer Schmerz","stechender Schmerz","bohrend","brennend","unerträglich"],
 koerper:["Ich zuckte kurz zusammen.","Ich biss die Zähne zusammen.","Ein Zischen entwich meinen Lippen.","Ich krümmte mich.","Ich stöhnte — und schämte mich nicht dafür.","Tränen pressten sich aus meinen Augen, obwohl ich es nicht wollte.","Alles drehte sich vor Schmerz.","Die Welt verschwamm vor mir zu einem einzigen weißen Rauschen."]},
{name:"Spaß",tags:["positiv"],col:"a",badge:"adt",fam:"Leichtigkeit",
 schritte:["amüsiert","belustigt","zum Lachen gereizt","kichernd","prustend","sich ausschütten vor Lachen"],
 koerper:["Ein Schmunzeln huschte über mein Gesicht.","Ich kicherte leise.","Ich lachte laut auf.","Ich prustete los — und konnte nicht mehr aufhören.","Tränen liefen mir über die Wangen.","Ich hielt mir den Bauch.","Ich konnte kaum noch Luft bekommen vor lauter Lachen."]},
{name:"Überraschung",tags:["körper"],col:"a",badge:"adt",fam:"Aktivierung",
 schritte:["stutzen","innehalten","überrascht","verblüfft","perplex","sprachlos","fassungslos"],
 koerper:["Ich hielt kurz die Luft an.","Meine Augen weiteten sich.","Mein Mund öffnete sich, ohne dass ich es bemerkte.","Ich trat unwillkürlich einen Schritt zurück.","Ich hielt mir die Hand vor den Mund.","Mir verschlug es die Sprache.","Mir wurde schwindelig — als hätte die Welt kurz angehalten."]},
{name:"Freude",tags:["positiv","körper"],col:"t",badge:"tdt",fam:"Wohlbefinden",
 schritte:["froh","erfreut","begeistert","fröhlich","strahlend","überschwänglich","jauchzend"],
 koerper:["Meine Augen leuchteten auf.","Ich lächelte unwillkürlich.","Mein Herz machte einen kleinen Hüpfer.","Ich klatschte in die Hände.","Meine Füße wollten springen.","Ich umarmte jeden, der in meiner Nähe war.","Es prickelte in meinen Fingerspitzen — wie lauter kleine Funken."]},
{name:"Freundschaft",tags:["positiv","sozial"],col:"pk",badge:"pkdt",fam:"Verbundenheit",
 schritte:["Sympathie","Zuneigung","Verbundenheit","tiefe Freundschaft","unzertrennlich","Seelenverwandtschaft"],

{name:"Anstrengung",tags:["körper"],col:"g",badge:"gdt",fam:"Körperzustand",

{name:"Müdigkeit",tags:["körper"],col:"g",badge:"gdt",fam:"Körperzustand",
 schritte:["ein wenig müde","schläfrig","erschöpft","todmüde","völlig ausgelaugt","am Ende der Kräfte"],
 koerper:["Ich musste gähnen — einmal, dann wieder.","Meine Lider wurden schwer.","Ich rieb mir die Augen.","Meine Glieder wurden bleischwer.","Ich kämpfte gegen das Einschlafen an.","Ich konnte mich kaum noch aufrecht halten.","Ich sackte in mich zusammen wie ein leeres Kleid."]},
{name:"Gemeinschaft",tags:["positiv","sozial"],col:"pk",badge:"pkdt",fam:"Verbundenheit",
 schritte:["zusammen sein","Zusammengehörigkeit spüren","Verbundenheit","Teil von etwas Größerem","eins mit der Gruppe","ein Herz und eine Seele"],
 koerper:["Eine Wärme strömte durch mich.","Ich spürte die Schultern der anderen neben mir.","Gemeinsames Lachen hallte durch den Raum.","Ich fühlte mich getragen.","Wir fielen uns in die Arme.","Mein Herz war zum Zerreißen voll — und es war das Schönste, das ich je gespürt hatte."]},
{name:"Fröhlichkeit",tags:["positiv"],col:"t",badge:"tdt",fam:"Wohlbefinden",
 schritte:["aufgeheitert","heiter","ausgelassen","übermütig","quirlig","sprühend vor Lebendigkeit"],
 koerper:["Mein Gang wurde leichter.","Meine Augen blitzten.","Lachen sprudelte aus mir heraus.","Ich begann leise vor mich hin zu summen.","Meine Füße wollten tanzen.","Ich konnte nicht stillsitzen — und hörte gar nicht mehr damit auf."]},
{name:"Tränen",tags:["körper"],col:"p",badge:"pdt",fam:"Anspannung",

 koerper:["Meine Augen brannten.","Ich schluckte gegen den Kloß in meinem Hals.","Meine Unterlippe zitterte.","Die erste Träne rollte meine Wange hinunter.","Ich konnte nicht mehr sprechen.","Ein Schluchzen zerriss mir die Brust.","Mein Körper bebte.","Ich weinte, bis nichts mehr kam — und noch ein wenig danach."]},
{name:"Dankbarkeit",tags:["positiv","sozial"],col:"t",badge:"tdt",fam:"Wohlbefinden",
 schritte:["erkenntlich sein","dankbar sein","tief dankbar","zu Tränen gerührt","überwältigt von Dankbarkeit","sprachlos vor Dankbarkeit"],
 koerper:["Eine Wärme breitete sich in meiner Brust aus.","Meine Kehle wurde eng.","Meine Augen wurden feucht.","Ich legte unwillkürlich die Hand auf mein Herz.","Mich ergriff ein tiefer Schauer.","Worte versagten mir — und ich ließ meine Umarmung sprechen."]},
{name:"Neugier",tags:["positiv","körper"],col:"a",badge:"adt",fam:"Aktivierung",

 koerper:["Ich spitzte die Ohren.","Ich rückte näher heran.","Meine Augen weiteten sich.","Ich beugte mich unwillkürlich vor.","Mein Herz schlug schneller.","Ich konnte an nichts anderes mehr denken — die Neugier fraß sich durch alles."]}
];

let activeTag="alle";

function setTag(t,btn){
  activeTag=t;
  document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  filter();
}

function filter(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const cards=document.querySelectorAll(".card");
  let vis=0;
  cards.forEach(c=>{
    const name=c.dataset.name.toLowerCase();
    const tags=c.dataset.tags;
    const matchQ=!q||name.includes(q)||c.dataset.body.toLowerCase().includes(q);
    const matchT=activeTag==="alle"||tags.includes(activeTag);
    if(matchQ&&matchT){c.classList.remove("hidden");vis++}else{c.classList.add("hidden")}
  });
  document.getElementById("cnt").textContent=vis+" von "+data.length+" Gefühlen";
}

function toggle(id){
  const b=document.getElementById("body-"+id);
  const a=document.getElementById("arr-"+id);
  const open=b.classList.toggle("open");
  a.style.transform=open?"rotate(180deg)":"rotate(0deg)";
}

function build(){
  const g=document.getElementById("grid");
  data.forEach((d,i)=>{
    const allText=d.schritte.join(" ")+d.koerper.join(" ");
    const card=document.createElement("div");
    card.className="card";
    card.dataset.name=d.name;
    card.dataset.tags=d.tags.join(",");
    card.dataset.body=allText;
    const steps=d.schritte.map((s,j)=>{
      const pct=Math.round((j/(d.schritte.length-1))*100);
      const opacity=0.45+0.55*(j/(d.schritte.length-1));
      return `<span class="step ${d.col}" style="opacity:${opacity}">${s}</span>${j<d.schritte.length-1?'<span class="arrow">›</span>':''}`
    }).join("");
    const krows=d.koerper.map((k,j)=>{
      const pct=Math.round((j/(d.koerper.length-1))*100);
      return `<div class="krow"><span class="knum">${j+1}</span><span class="ktext">${k}</span></div>`
    }).join("");
    card.innerHTML=`
<div class="card-head" onclick="toggle(${i})">
  <div class="dot" style="background:currentColor" class="${d.badge}"></div>
  <span class="emo-name">${d.name}</span>
  <span class="badge ${d.col}">${d.fam}</span>
  <span class="toggle" id="arr-${i}" style="font-style:normal">⌄</span>
</div>
<div class="card-body" id="body-${i}">
  <p class="section-label">Steigerung der Begriffe</p>
  <div class="steps">${steps}</div>
  <hr class="divider">
  <p class="section-label">Körperliche Empfindungen (aufsteigend)</p>
  <div class="koerper">${krows}</div>
</div>`;
    g.appendChild(card);
  });
  filter();
}

build();
</script>
