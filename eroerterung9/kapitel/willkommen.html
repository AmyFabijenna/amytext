<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erörterung für die 9. Schulstufe verfassen - Willkommen</title>
    
</head>
<body>
    <div class="container">
        <div class="navigation">
            <a href="https://amyfabijenna.github.io/amylang-deutsch/" class="home-link">← Zur Hauptseite</a>
        </div>
        
        <h1>Willkommen</h1>
        
        <p>Willkommen zu Eröterung verfassen für die 9. Schulstufe!</p>
        
        <div class="info-message">
            Gerne auf Anfrage
        </div>
        
        <div class="whatsapp-button-container">
            <a href="https://wa.me/36301818503" class="whatsapp-button" target="_blank">
                Senden Sie mir eine Nachricht!
            </a>
        </div>
        
        <!-- Abschluss -->
        <div class="closing-section">
            <h2>Viel Erfolg beim Lernen!</h2>
            <p style="margin-bottom: 0;">Wir unterstützen Sie gerne bei Ihrem Lernprozess!</p>
        </div>
    </div>
    
    <script>
        // Einfache Interaktivität für bessere Benutzererfahrung
        document.addEventListener('DOMContentLoaded', function() {
            // Navigation smooth scrolling für interne Links
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
